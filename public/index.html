<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Xray Control Panel</title>

<style>
:root{
  --bg:#050706;
  --bg2:#080c09;
  --panel:#0b110d;
  --panel2:#0e1611;
  --border:#18351f;
  --green:#00ff73;
  --green2:#00c95a;
  --text:#e8fff0;
  --muted:#789582;
  --danger:#ff4566;
  --warning:#ffc857;
  --shadow:0 0 30px rgba(0,255,115,.07);
}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}

body{
  background:
    radial-gradient(circle at 15% 10%,rgba(0,255,115,.08),transparent 30%),
    radial-gradient(circle at 85% 80%,rgba(0,255,115,.05),transparent 30%),
    var(--bg);
}

/* animated grid */
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.18;
  background-image:
    linear-gradient(rgba(0,255,115,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,255,115,.035) 1px,transparent 1px);
  background-size:42px 42px;
  mask-image:linear-gradient(to bottom,black,transparent);
}

/* LOGIN */
#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:min(430px,100%);
  background:rgba(9,15,11,.92);
  border:1px solid var(--border);
  border-radius:24px;
  padding:38px;
  box-shadow:0 0 70px rgba(0,255,115,.08);
  animation:rise .6s ease;
}

.logo{
  display:flex;
  align-items:center;
  gap:13px;
  margin-bottom:30px;
}

.logo-icon{
  width:48px;
  height:48px;
  border-radius:14px;
  display:grid;
  place-items:center;
  color:#001b0c;
  background:var(--green);
  font-weight:900;
  box-shadow:0 0 25px rgba(0,255,115,.4);
}

.logo h1{margin:0;font-size:22px}
.logo small{color:var(--muted)}

.field{margin-bottom:17px}
.field label{
  display:block;
  margin-bottom:7px;
  color:#a9c7b2;
  font-size:13px;
}

input,select,textarea{
  width:100%;
  color:var(--text);
  background:#070c09;
  border:1px solid #1b3823;
  border-radius:10px;
  padding:12px 13px;
  outline:none;
  transition:.2s;
}

input:focus,select:focus,textarea:focus{
  border-color:var(--green2);
  box-shadow:0 0 0 3px rgba(0,255,115,.07);
}

textarea{min-height:100px;resize:vertical}

.primary{
  border:0;
  background:var(--green);
  color:#001b0c;
  font-weight:800;
  border-radius:10px;
  padding:12px 17px;
  transition:.2s;
}

.primary:hover{
  transform:translateY(-1px);
  box-shadow:0 0 25px rgba(0,255,115,.22);
}

.secondary{
  background:#0d1710;
  border:1px solid var(--border);
  color:var(--text);
  border-radius:10px;
  padding:10px 15px;
}

.danger{
  background:rgba(255,69,102,.08);
  border:1px solid rgba(255,69,102,.3);
  color:#ff7189;
  border-radius:9px;
  padding:9px 13px;
}

.full{width:100%}

.error{
  color:#ff7189;
  min-height:20px;
  font-size:13px;
  margin:7px 0;
}

/* APP */
#app{display:none;min-height:100vh}

.layout{
  display:grid;
  grid-template-columns:245px 1fr;
  min-height:100vh;
}

.sidebar{
  position:fixed;
  inset:0 auto 0 0;
  width:245px;
  border-right:1px solid var(--border);
  background:rgba(5,9,7,.96);
  padding:20px 14px;
  z-index:10;
}

.side-logo{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  margin-bottom:20px;
}

.side-logo .logo-icon{
  width:38px;
  height:38px;
  font-size:14px;
}

.side-logo strong{font-size:15px}
.side-logo span{display:block;color:var(--muted);font-size:11px;margin-top:3px}

.nav-section{
  color:#42634d;
  font-size:10px;
  font-weight:800;
  letter-spacing:1.5px;
  padding:15px 10px 7px;
}

.nav button{
  width:100%;
  text-align:left;
  border:1px solid transparent;
  background:transparent;
  color:#91aa98;
  padding:11px 12px;
  border-radius:9px;
  margin-bottom:3px;
  transition:.2s;
}

.nav button:hover,
.nav button.active{
  color:var(--green);
  background:rgba(0,255,115,.055);
  border-color:rgba(0,255,115,.09);
}

.main{
  grid-column:2;
  padding:28px;
  max-width:1600px;
  width:100%;
  margin:auto;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:25px;
}

.page-title h2{margin:0;font-size:25px}
.page-title p{margin:6px 0 0;color:var(--muted);font-size:13px}

.user-area{
  display:flex;
  gap:10px;
  align-items:center;
}

.status{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:12px;
  color:#79aa87;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 12px var(--green);
}

/* CARDS */
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.stat{
  padding:20px;
  background:linear-gradient(145deg,#0b120e,#080d0a);
  border:1px solid var(--border);
  border-radius:15px;
  transition:.25s;
}

.stat:hover{
  transform:translateY(-3px);
  border-color:#23542f;
  box-shadow:var(--shadow);
}

.stat .num{
  font-size:28px;
  font-weight:800;
  color:var(--green);
}

.stat .label{
  color:var(--muted);
  font-size:12px;
  margin-top:5px;
}

.panel{
  background:rgba(9,15,11,.9);
  border:1px solid var(--border);
  border-radius:15px;
  padding:20px;
  margin-bottom:18px;
}

.panel-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:17px;
}

.panel-head h3{margin:0;font-size:16px}
.panel-head span{font-size:12px;color:var(--muted)}

.toolbar{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-bottom:16px;
}

.search{
  max-width:320px;
}

/* TABLE */
.table-wrap{overflow:auto}

table{
  width:100%;
  border-collapse:collapse;
  min-width:700px;
}

th{
  color:#52725d;
  font-size:11px;
  font-weight:700;
  text-align:left;
  padding:11px;
  border-bottom:1px solid var(--border);
}

td{
  padding:13px 11px;
  border-bottom:1px solid rgba(24,53,31,.65);
  color:#b8cdbd;
  font-size:13px;
}

tr:hover td{background:rgba(0,255,115,.018)}

.badge{
  display:inline-flex;
  padding:4px 8px;
  border-radius:99px;
  font-size:10px;
  font-weight:700;
  background:#101b14;
  border:1px solid #1d3a25;
}

.badge.on{
  color:var(--green);
  border-color:rgba(0,255,115,.25);
}

.badge.off{
  color:#75847a;
}

.actions{
  display:flex;
  gap:6px;
}

.icon-btn{
  border:1px solid var(--border);
  background:#0a110c;
  color:#9ab29f;
  border-radius:7px;
  padding:6px 9px;
}

.icon-btn:hover{color:var(--green);border-color:#276036}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(7px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:50;
}

.modal.show{display:flex}

.modal-box{
  width:min(900px,100%);
  max-height:92vh;
  overflow:auto;
  background:#090f0b;
  border:1px solid #21472b;
  border-radius:18px;
  box-shadow:0 0 70px rgba(0,255,115,.1);
  animation:rise .25s ease;
}

.modal-head{
  padding:18px 20px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  background:#090f0b;
  z-index:2;
}

.modal-head h3{margin:0}

.modal-body{padding:20px}

.modal-foot{
  padding:15px 20px;
  border-top:1px solid var(--border);
  display:flex;
  justify-content:flex-end;
  gap:9px;
  position:sticky;
  bottom:0;
  background:#090f0b;
}

.close{
  background:none;
  border:0;
  color:#718c78;
  font-size:22px;
}

/* FORM */
.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.form-grid.three{
  grid-template-columns:repeat(3,1fr);
}

.span2{grid-column:1/-1}

.switch{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px;
  background:#080e0a;
  border:1px solid var(--border);
  border-radius:10px;
}

.switch input{width:auto}

.accordion{
  border:1px solid var(--border);
  border-radius:12px;
  margin-bottom:11px;
  overflow:hidden;
}

.acc-head{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#0b130d;
  border:0;
  color:var(--text);
  padding:15px;
  text-align:left;
  font-weight:700;
}

.acc-head:hover{color:var(--green)}

.acc-body{
  display:none;
  padding:17px;
  background:#080e0a;
}

.accordion.open .acc-body{display:block}

.client-list{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.client-card{
  padding:16px;
  background:linear-gradient(145deg,#0c1510,#08100b);
  border:1px solid var(--border);
  border-radius:13px;
  animation:cardIn .3s ease;
}

.client-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:13px;
}

.client-email{
  font-weight:700;
  color:var(--green);
}

.meta{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.meta div{
  background:#080d0a;
  border:1px solid #13291a;
  border-radius:7px;
  padding:8px;
}

.meta small{display:block;color:#4f6b56;font-size:9px}
.meta span{font-size:11px;color:#b9cabb;word-break:break-all}

.empty{
  text-align:center;
  padding:45px 20px;
  color:#49614f;
}

/* TOAST */
#toast{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:100;
  background:#0d1810;
  border:1px solid #285534;
  color:#c9e9d0;
  padding:12px 16px;
  border-radius:10px;
  transform:translateY(100px);
  opacity:0;
  transition:.25s;
}

#toast.show{
  transform:translateY(0);
  opacity:1;
}

#toast.bad{
  border-color:#70243a;
  color:#ff9caf;
}

/* MOBILE */
@media(max-width:950px){
  .layout{display:block}
  .sidebar{
    position:relative;
    width:100%;
    height:auto;
    border-right:0;
    border-bottom:1px solid var(--border);
  }
  .nav{
    display:flex;
    overflow:auto;
    gap:5px;
  }
  .nav-section{display:none}
  .nav button{white-space:nowrap;width:auto}
  .main{padding:18px}
  .grid{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:650px){
  .grid,
  .form-grid,
  .form-grid.three,
  .client-list{grid-template-columns:1fr}
  .span2{grid-column:auto}
  .topbar{align-items:flex-start;gap:15px;flex-direction:column}
  .login-box{padding:25px}
}

/* ANIMATIONS */
@keyframes rise{
  from{opacity:0;transform:translateY(15px)}
  to{opacity:1;transform:translateY(0)}
}

@keyframes cardIn{
  from{opacity:0;transform:scale(.97)}
  to{opacity:1;transform:scale(1)}
}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="loginScreen">
  <div class="login-box">
    <div class="logo">
      <div class="logo-icon">XR</div>
      <div>
        <h1>Xray Control</h1>
        <small>Secure Management Panel</small>
      </div>
    </div>

    <form id="loginForm">
      <div class="field">
        <label>Username</label>
        <input id="loginUser" autocomplete="username" value="admin" required>
      </div>

      <div class="field">
        <label>Password</label>
        <input id="loginPass" type="password" autocomplete="current-password" required>
      </div>

      <div id="loginError" class="error"></div>

      <button class="primary full" type="submit">Sign in</button>
    </form>
  </div>
</section>

<!-- APP -->
<section id="app">

<div class="layout">

  <aside class="sidebar">

    <div class="side-logo">
      <div class="logo-icon">XR</div>
      <div>
        <strong>Xray Control</strong>
        <span>Management Panel</span>
      </div>
    </div>

    <div class="nav">

      <div class="nav-section">OVERVIEW</div>
      <button data-page="dashboard" class="active">◈ Dashboard</button>

      <div class="nav-section">XRAY</div>
      <button data-page="inbounds">⇄ Inbounds</button>
      <button data-page="clients">◉ Clients</button>
      <button data-page="outbounds">→ Outbound</button>
      <button data-page="routing">⌘ Routing</button>

      <div class="nav-section">INFRASTRUCTURE</div>
      <button data-page="hosts">◇ Hosts</button>
      <button data-page="nodes">◆ Nodes</button>
      <button data-page="groups">◎ Groups</button>

      <div class="nav-section">SYSTEM</div>
      <button data-page="xray">⚡ Xray</button>
      <button data-page="settings">⚙ Settings</button>
      <button data-page="docs">▤ API Docs</button>

    </div>

    <div style="position:absolute;left:14px;right:14px;bottom:16px">
      <button class="secondary full" onclick="logout()">Logout</button>
    </div>

  </aside>

  <main class="main">

    <div class="topbar">
      <div class="page-title">
        <h2 id="pageTitle">Dashboard</h2>
        <p id="pageSubtitle">System overview</p>
      </div>

      <div class="user-area">
        <div class="status">
          <i class="dot"></i>
          <span id="userName">admin</span>
        </div>
      </div>
    </div>

    <div id="content"></div>

  </main>
</div>
</section>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modalTitle">Create</h3>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <div id="modalBody" class="modal-body"></div>
    <div id="modalFoot" class="modal-foot"></div>
  </div>
</div>

<div id="toast"></div>

<script>
/* =========================================================
   AUTH
========================================================= */

let authToken = localStorage.getItem("xray_token") || "";
let currentPage = "dashboard";
let cache = {
  inbounds:[],
  clients:[],
  groups:[],
  nodes:[],
  hosts:[],
  outbounds:[],
  routing:[]
};

async function api(url, options={}){
  const headers = {
    "Content-Type":"application/json",
    ...(options.headers || {})
  };

  if(authToken){
    headers.Authorization = "Bearer " + authToken;
  }

  const response = await fetch("/api" + url,{
    ...options,
    credentials:"same-origin",
    headers
  });

  const data = await response.json().catch(()=>({}));

  if(!response.ok){
    if(response.status === 401){
      authToken="";
      localStorage.removeItem("xray_token");
      localStorage.removeItem("xray_session");
      showLogin();
    }

    throw new Error(data.error || data.message || "Request failed");
  }

  return data;
}

function showLogin(){
  document.getElementById("loginScreen").style.display="flex";
  document.getElementById("app").style.display="none";
}

function showApp(){
  document.getElementById("loginScreen").style.display="none";
  document.getElementById("app").style.display="block";
}

document.getElementById("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();

  const error=document.getElementById("loginError");
  error.textContent="Signing in...";

  try{
    const data=await api("/login",{
      method:"POST",
      body:JSON.stringify({
        username:document.getElementById("loginUser").value,
        password:document.getElementById("loginPass").value
      })
    });

    authToken=data.token || data.accessToken || data.access_token || "";

    if(!authToken) throw new Error("Server did not return a token");

    localStorage.setItem("xray_token",authToken);
    localStorage.setItem("xray_session","1");

    document.getElementById("userName").textContent=data.username || "admin";

    showApp();
    await loadPage("dashboard");

  }catch(err){
    error.textContent=err.message;
  }
});

async function checkSession(){
  if(!authToken){
    showLogin();
    return;
  }

  try{
    const me=await api("/me");
    document.getElementById("userName").textContent=me.username || "admin";
    showApp();
    await loadPage("dashboard");
  }catch{
    showLogin();
  }
}

function logout(){
  authToken="";
  localStorage.removeItem("xray_token");
  localStorage.removeItem("xray_session");
  showLogin();
}

/* =========================================================
   UI
========================================================= */

const pageInfo={
  dashboard:["Dashboard","System overview"],
  inbounds:["Inbounds","Manage Xray inbound listeners"],
  clients:["Clients","Manage user accounts"],
  groups:["Groups","Organize clients"],
  nodes:["Nodes","Remote infrastructure"],
  hosts:["Hosts","TLS and transport hosts"],
  outbounds:["Outbound","Outbound connections"],
  routing:["Routing","Traffic routing rules"],
  xray:["Xray","Core status and generated configuration"],
  settings:["Settings","Panel configuration"],
  docs:["API Docs","Available API endpoints"]
};

document.querySelectorAll(".nav button[data-page]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    loadPage(btn.dataset.page);
  });
});

async function loadPage(page){
  currentPage=page;

  document.querySelectorAll(".nav button").forEach(b=>{
    b.classList.toggle("active",b.dataset.page===page);
  });

  document.getElementById("pageTitle").textContent=pageInfo[page][0];
  document.getElementById("pageSubtitle").textContent=pageInfo[page][1];

  const content=document.getElementById("content");
  content.innerHTML='<div class="panel"><div class="empty">Loading...</div></div>';

  try{
    switch(page){
      case"dashboard":await renderDashboard();break;
      case"inbounds":await renderInbounds();break;
      case"clients":await renderClients();break;
      case"groups":await renderGroups();break;
      case"nodes":await renderNodes();break;
      case"hosts":await renderHosts();break;
      case"outbounds":await renderOutbounds();break;
      case"routing":await renderRouting();break;
      case"xray":await renderXray();break;
      case"settings":await renderSettings();break;
      case"docs":await renderDocs();break;
    }
  }catch(err){
    content.innerHTML=
      '<div class="panel"><div class="empty">Error: '+esc(err.message)+'</div></div>';
  }
}

function esc(v){
  return String(v??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

function toast(message,bad=false){
  const el=document.getElementById("toast");
  el.textContent=message;
  el.className="show"+(bad?" bad":"");

  clearTimeout(window.__toast);
  window.__toast=setTimeout(()=>el.className="",2800);
}

function openModal(title,body,save){
  document.getElementById("modalTitle").textContent=title;
  document.getElementById("modalBody").innerHTML=body;

  document.getElementById("modalFoot").innerHTML=`
    <button class="secondary" onclick="closeModal()">Cancel</button>
    <button class="primary" id="modalSave">Save</button>
  `;

  document.getElementById("modal").classList.add("show");

  document.getElementById("modalSave").onclick=save;
}

function closeModal(){
  document.getElementById("modal").classList.remove("show");
}

function val(id){
  return document.getElementById(id)?.value || "";
}

function checked(id){
  return document.getElementById(id)?.checked ? 1 : 0;
}

function input(id,label,value="",type="text",extra=""){
  return `
  <div class="field">
    <label>${label}</label>
    <input id="${id}" type="${type}" value="${esc(value)}" ${extra}>
  </div>`;
}

function select(id,label,value,options){
  return `
  <div class="field">
    <label>${label}</label>
    <select id="${id}">
      ${options.map(x=>`
        <option value="${esc(x[0])}" ${x[0]===value?"selected":""}>${esc(x[1])}</option>
      `).join("")}
    </select>
  </div>`;
}

function area(id,label,value=""){
  return `
  <div class="field span2">
    <label>${label}</label>
    <textarea id="${id}">${esc(value)}</textarea>
  </div>`;
}

function sw(id,label,value=true){
  return `
  <div class="switch">
    <span>${label}</span>
    <input id="${id}" type="checkbox" ${value?"checked":""}>
  </div>`;
}

function accordion(title,body,open=false){
  return `
  <div class="accordion ${open?"open":""}">
    <button class="acc-head" type="button"
      onclick="this.parentElement.classList.toggle('open')">
      <span>${title}</span><span>⌄</span>
    </button>
    <div class="acc-body">${body}</div>
  </div>`;
}

/* =========================================================
   DASHBOARD
========================================================= */

async function renderDashboard(){
  const s=await api("/stats");

  document.getElementById("content").innerHTML=`
    <div class="grid">
      ${stat(s.inbounds,"Inbounds")}
      ${stat(s.clients,"Clients")}

function setupSecurityFields(){
  const sec=document.getElementById("ib_security");
  if(!sec)return;

  function update(){
    const value=sec.value;
    document.getElementById("tlsFields").style.display=
      value==="tls"?"block":"none";

    document.getElementById("realityFields").style.display=
      value==="reality"?"block":"none";
  }

  sec.addEventListener("change",update);
  update();
}

async function renderXray(){
  let config;

  try{
    config=await api("/config");
  }catch(e){
    config={error:e.message};
  }

  document.getElementById("content").innerHTML=`
  <div class="grid">
    <div class="stat">
      <div class="num" style="font-size:20px">
        ${config?.xray_core_running?"ONLINE":"OFFLINE"}
      </div>
      <div class="label">Xray Core</div>
    </div>

    <div class="stat">
      <div class="num">${config?.inbounds?.length||0}</div>
      <div class="label">Generated Inbounds</div>
    </div>

    <div class="stat">
      <div class="num">${config?.clients?.length||0}</div>
      <div class="label">Active Clients</div>
    </div>

    <div class="stat">
      <div class="num">${config?.outbounds?.length||0}</div>
      <div class="label">Active Outbounds</div>
    </div>
  </div>

  <div style="height:18px"></div>

  <div class="panel">
    <div class="panel-head">
      <h3>Core Status</h3>
    </div>

    <p style="color:var(--muted);line-height:1.8">
      ${esc(config?.note||"Xray core status unavailable.")}
    </p>

    <button class="secondary" onclick="downloadConfig()">View Generated Config</button>
  </div>
  `;
}

async function downloadConfig(){
  try{
    const data=await api("/config");

    const blob=new Blob(
      [JSON.stringify(data,null,2)],
      {type:"application/json"}
    );

    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="xray-config.json";
    a.click();

    URL.revokeObjectURL(a.href);
  }catch(e){toast(e.message,true)}
}

function filterTable(tableId,q){
  q=q.toLowerCase();

  document.querySelectorAll("#"+tableId+" tbody tr").forEach(row=>{
    row.style.display=row.innerText.toLowerCase().includes(q)?"":"none";
  });
}
