<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xray Control Panel</title>

  <style>
    :root {
      --bg: #050807;
      --bg2: #080d0a;
      --panel: rgba(10, 17, 13, .88);
      --panel2: rgba(14, 23, 17, .94);
      --line: rgba(57, 255, 120, .14);
      --line2: rgba(57, 255, 120, .28);
      --green: #39ff78;
      --green2: #19d95c;
      --text: #e9fff0;
      --muted: #789083;
      --danger: #ff4d67;
      --warning: #ffd166;
      --blue: #53b9ff;
      --shadow: 0 0 35px rgba(57,255,120,.08);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      scrollbar-width: thin;
      scrollbar-color: #173d25 #050807;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* ================= BACKGROUND ================= */

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -5;
      background:
        linear-gradient(rgba(57,255,120,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(57,255,120,.025) 1px, transparent 1px);
      background-size: 42px 42px;
      animation: gridMove 18s linear infinite;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 100;
      background: linear-gradient(
        transparent 0%,
        rgba(57,255,120,.018) 50%,
        transparent 100%
      );
      background-size: 100% 7px;
      opacity: .35;
    }

    @keyframes gridMove {
      from { transform: translateY(0); }
      to { transform: translateY(42px); }
    }

    .orb {
      position: fixed;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(100px);
      opacity: .07;
      z-index: -4;
      background: var(--green);
      animation: orbFloat 14s ease-in-out infinite;
    }

    .orb.one {
      top: -180px;
      left: 20%;
    }

    .orb.two {
      bottom: -220px;
      right: 5%;
      animation-delay: -7s;
    }

    @keyframes orbFloat {
      0%, 100% { transform: translate(0,0) scale(1); }
      50% { transform: translate(60px,30px) scale(1.12); }
    }

    /* ================= LOGIN ================= */

    .login-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      position: relative;
    }

    .login-box {
      width: min(430px, 100%);
      background: rgba(7,12,9,.9);
      border: 1px solid var(--line2);
      border-radius: 24px;
      padding: 34px;
      box-shadow:
        0 0 80px rgba(57,255,120,.08),
        inset 0 0 40px rgba(57,255,120,.025);
      animation: loginIn .8s cubic-bezier(.16,1,.3,1);
      position: relative;
      overflow: hidden;
    }

    .login-box::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 70%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--green), transparent);
      animation: scanLine 3s linear infinite;
    }

    @keyframes scanLine {
      to { left: 140%; }
    }

    @keyframes loginIn {
      from {
        opacity: 0;
        transform: translateY(30px) scale(.96);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    .logo {
      width: 70px;
      height: 70px;
      border: 1px solid var(--green);
      border-radius: 20px;
      display: grid;
      place-items: center;
      color: var(--green);
      font-size: 30px;
      margin-bottom: 22px;
      box-shadow: 0 0 30px rgba(57,255,120,.16);
      animation: logoPulse 2.4s ease-in-out infinite;
    }

    @keyframes logoPulse {
      0%,100% { box-shadow: 0 0 20px rgba(57,255,120,.1); }
      50% { box-shadow: 0 0 45px rgba(57,255,120,.28); }
    }

    .login-box h1 {
      margin: 0 0 8px;
      font-size: 27px;
    }

    .login-box p {
      color: var(--muted);
      margin: 0 0 26px;
    }

    /* ================= LAYOUT ================= */

    .app {
      min-height: 100vh;
      display: none;
    }

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 255px;
      padding: 20px 14px;
      border-right: 1px solid var(--line);
      background: rgba(4,8,6,.94);
      backdrop-filter: blur(20px);
      z-index: 20;
      overflow-y: auto;
    }

    .brand {
      padding: 12px 12px 22px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 14px;
    }

    .brand-title {
      font-weight: 800;
      font-size: 18px;
      letter-spacing: .5px;
    }

    .brand-sub {
      color: var(--muted);
      font-size: 11px;
      margin-top: 4px;
    }

    .nav-group {
      margin: 18px 7px 7px;
      font-size: 10px;
      text-transform: uppercase;
      color: #4f6758;
      letter-spacing: 1.4px;
    }

    .nav-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 11px 12px;
      margin: 4px 0;
      border: 1px solid transparent;
      border-radius: 11px;
      background: transparent;
      color: #94aa9b;
      text-align: left;
      transition: .25s ease;
    }

    .nav-btn:hover {
      color: var(--text);
      background: rgba(57,255,120,.05);
      border-color: var(--line);
      transform: translateX(3px);
    }

    .nav-btn.active {
      color: var(--green);
      background: rgba(57,255,120,.075);
      border-color: var(--line2);
      box-shadow: inset 3px 0 0 var(--green), 0 0 20px rgba(57,255,120,.04);
    }

    .nav-icon {
      width: 22px;
      text-align: center;
    }

    .main {
      margin-left: 255px;
      min-height: 100vh;
    }

    .topbar {
      height: 72px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      background: rgba(4,8,6,.72);
      backdrop-filter: blur(18px);
      position: sticky;
      top: 0;
      z-index: 15;
    }

    .page-title {
      font-size: 20px;
      font-weight: 750;
    }

    .content {
      padding: 28px;
      max-width: 1500px;
      margin: auto;
    }

    /* ================= BUTTONS ================= */

    .btn {
      border: 1px solid var(--line2);
      background: rgba(57,255,120,.06);
      color: var(--green);
      padding: 10px 15px;
      border-radius: 10px;
      transition: .25s ease;
      position: relative;
      overflow: hidden;
    }

    .btn::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-120%);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.09), transparent);
      transition: .5s;
    }

    .btn:hover::after {
      transform: translateX(120%);
    }

    .btn:hover {
      transform: translateY(-2px);
      border-color: var(--green);
      box-shadow: 0 0 24px rgba(57,255,120,.13);
    }

    .btn.primary {
      background: var(--green);
      color: #031006;
      font-weight: 800;
      border-color: var(--green);
    }

    .btn.danger {
      color: var(--danger);
      border-color: rgba(255,77,103,.25);
      background: rgba(255,77,103,.05);
    }

    .btn.small {
      padding: 7px 10px;
      font-size: 12px;
    }

    /* ================= CARDS ================= */

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .card-head {
      padding: 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .card-body {
      padding: 18px;
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .grid-2 {
      grid-template-columns: repeat(2, minmax(0,1fr));
    }

    .grid-3 {
      grid-template-columns: repeat(3, minmax(0,1fr));
    }

    .grid-4 {
      grid-template-columns: repeat(4, minmax(0,1fr));
    }

    /* ================= STATS ================= */

    .stat {
      padding: 20px;
      position: relative;
      overflow: hidden;
      animation: itemIn .55s both;
    }

    .stat::before {
      content: "";
      position: absolute;
      width: 100px;
      height: 100px;
      right: -35px;
      top: -35px;
      background: var(--green);
      filter: blur(45px);
      opacity: .08;
    }

    .stat:hover {
      transform: translateY(-4px);
      border-color: var(--line2);
    }

    .stat-value {
      font-size: 31px;
      font-weight: 850;
      color: var(--green);
    }

    .stat-label {
      color: var(--muted);
      font-size: 12px;
      margin-top: 5px;
    }

    /* ================= FORMS ================= */

    .form {
      display: grid;
      gap: 14px;
    }

    .field {
      animation: fieldIn .45s both;
    }

    .field:nth-child(2) { animation-delay: .03s; }
    .field:nth-child(3) { animation-delay: .06s; }
    .field:nth-child(4) { animation-delay: .09s; }
    .field:nth-child(5) { animation-delay: .12s; }
    .field:nth-child(6) { animation-delay: .15s; }

    @keyframes fieldIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    label {
      display: block;
      font-size: 12px;
      color: #91a99a;
      margin-bottom: 7px;
    }

    input,
    select,
    textarea {
      width: 100%;
      color: var(--text);
      background: #070d09;
      border: 1px solid #193023;
      border-radius: 10px;
      outline: none;
      padding: 11px 12px;
      transition: .25s ease;
    }

    input:hover,
    select:hover,
    textarea:hover {
      border-color: rgba(57,255,120,.28);
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--green);
      box-shadow:
        0 0 0 3px rgba(57,255,120,.07),
        0 0 24px rgba(57,255,120,.08);
      transform: translateY(-1px);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    /* ================= ANIMATED FORM SECTIONS ================= */

    .form-sections {
      display: grid;
      gap: 12px;
    }

    .form-section {
      border: 1px solid var(--line);
      background: rgba(8,14,10,.78);
      border-radius: 15px;
      overflow: hidden;
      position: relative;
      transition: .3s ease;
    }

    .form-section::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background: transparent;
      transition: .35s;
    }

    .form-section.open {
      border-color: var(--line2);
      box-shadow: 0 0 28px rgba(57,255,120,.045);
    }

    .form-section.open::before {
      background: var(--green);
      box-shadow: 0 0 14px var(--green);
    }

    .section-head {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text);
      padding: 16px 17px;
      display: flex;
      align-items: center;
      gap: 13px;
      text-align: left;
    }

    .section-head:hover {
      background: rgba(57,255,120,.025);
    }

    .section-icon {
      width: 35px;
      height: 35px;
      border-radius: 10px;
      border: 1px solid var(--line2);
      display: grid;
      place-items: center;
      color: var(--green);
      background: rgba(57,255,120,.045);
      transition: .35s;
    }

    .form-section.open .section-icon {
      transform: rotate(-5deg) scale(1.06);
      box-shadow: 0 0 20px rgba(57,255,120,.12);
    }

    .section-title {
      font-size: 14px;
      font-weight: 750;
    }

    .section-subtitle {
      color: #607669;
      font-size: 11px;
      margin-top: 2px;
    }

    .section-copy {
      flex: 1;
    }

    .chevron {
      color: #5c7667;
      transition: .35s;
      font-size: 18px;
    }

    .form-section.open .chevron {
      color: var(--green);
      transform: rotate(180deg);
    }

    .section-body {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      transform: translateY(-7px);
      transition:
        grid-template-rows .42s cubic-bezier(.16,1,.3,1),
        opacity .25s ease,
        transform .3s ease;
    }

    .form-section.open .section-body {
      grid-template-rows: 1fr;
      opacity: 1;
      transform: none;
    }

    .section-inner {
      min-height: 0;
      overflow: hidden;
      padding: 0 17px;
      transition: padding .35s ease;
    }

    .form-section.open .section-inner {
      padding: 0 17px 18px;
    }

    /* ================= CONDITIONAL AREAS ================= */

    .conditional {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      overflow: hidden;
      transition:
        grid-template-rows .45s cubic-bezier(.16,1,.3,1),
        opacity .25s;
    }

    .conditional.show {
      grid-template-rows: 1fr;
      opacity: 1;
    }

    .conditional-inner {
      min-height: 0;
      overflow: hidden;
    }

    .conditional-box {
      margin-top: 14px;
      padding: 15px;
      border-radius: 13px;
      border: 1px dashed rgba(57,255,120,.2);
      background: rgba(57,255,120,.018);
    }

    /* ================= SWITCH ================= */

    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 10px 0;
    }

    .switch {
      position: relative;
      width: 46px;
      height: 25px;
      flex: 0 0 auto;
    }

    .switch input {
      display: none;
    }

    .slider {
      position: absolute;
      inset: 0;
      border: 1px solid #254331;
      border-radius: 30px;
      background: #0a120d;
      transition: .3s;
    }

    .slider::before {
      content: "";
      width: 17px;
      height: 17px;
      position: absolute;
      top: 3px;
      left: 3px;
      border-radius: 50%;
      background: #547061;
      transition: .3s;
    }

    .switch input:checked + .slider {
      background: rgba(57,255,120,.12);
      border-color: var(--green);
      box-shadow: 0 0 16px rgba(57,255,120,.12);
    }

    .switch input:checked + .slider::before {
      transform: translateX(21px);
      background: var(--green);
      box-shadow: 0 0 12px var(--green);
    }

    /* ================= CLIENT CARDS ================= */

    .clients-list {
      display: grid;
      gap: 12px;
    }

    .client-card {
      border: 1px solid #1a3524;
      border-radius: 14px;
      background: linear-gradient(145deg, rgba(12,23,15,.9), rgba(6,12,8,.92));
      padding: 15px;
      position: relative;
      animation: clientAdd .5s cubic-bezier(.16,1,.3,1);
      transition: .3s;
    }

    .client-card:hover {
      border-color: rgba(57,255,120,.32);
      transform: translateY(-2px);
      box-shadow: 0 10px 35px rgba(0,0,0,.2);
    }

    @keyframes clientAdd {
      from {
        opacity: 0;
        transform: translateX(-15px) scale(.97);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    .client-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 13px;
    }

    .client-title {
      color: var(--green);
      font-size: 13px;
      font-weight: 750;
    }

    .client-actions {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      width: 31px;
      height: 31px;
      border-radius: 8px;
      border: 1px solid #1d3927;
      background: #09120c;
      color: #7c9585;
      transition: .2s;
    }

    .icon-btn:hover {
      color: var(--green);
      border-color: var(--green);
      transform: scale(1.06);
    }

    .icon-btn.danger:hover {
      color: var(--danger);
      border-color: var(--danger);
    }

    .add-client {
      width: 100%;
      padding: 15px;
      border: 1px dashed rgba(57,255,120,.25);
      border-radius: 13px;
      background: rgba(57,255,120,.025);
      color: var(--green);
      transition: .3s;
    }

    .add-client:hover {
      border-style: solid;
      background: rgba(57,255,120,.055);
      box-shadow: 0 0 25px rgba(57,255,120,.06);
      transform: translateY(-2px);
    }

    /* ================= TABLE ================= */

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      color: #60796a;
      font-size: 11px;
      font-weight: 600;
      padding: 13px;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }

    td {
      padding: 14px 13px;
      border-bottom: 1px solid rgba(57,255,120,.055);
      font-size: 13px;
      white-space: nowrap;
    }

    tbody tr {
      animation: rowIn .4s both;
      transition: .2s;
    }

    tbody tr:hover {
      background: rgba(57,255,120,.025);
    }

    @keyframes rowIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line2);
      border-radius: 30px;
      padding: 4px 8px;
      font-size: 10px;
      color: var(--green);
      background: rgba(57,255,120,.045);
    }

    .badge.off {
      color: #75887c;
      border-color: #25372c;
      background: rgba(255,255,255,.02);
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
    }

    /* ================= MODAL ================= */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.72);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal.show {
      display: flex;
      animation: fadeIn .2s ease;
    }

    .modal-box {
      width: min(900px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      background: #071009;
      border: 1px solid var(--line2);
      border-radius: 20px;
      box-shadow: 0 0 80px rgba(57,255,120,.12);
      animation: modalIn .42s cubic-bezier(.16,1,.3,1);
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: translateY(25px) scale(.95);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-head {
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      background: rgba(7,16,9,.95);
      z-index: 2;
    }

    .modal-title {
      font-size: 17px;
      font-weight: 800;
    }

    .modal-body {
      padding: 20px;
    }

    .modal-foot {
      padding: 15px 20px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      border-top: 1px solid var(--line);
      position: sticky;
      bottom: 0;
      background: rgba(7,16,9,.95);
    }

    /* ================= DASHBOARD ================= */

    .hero {
      padding: 24px;
      margin-bottom: 18px;
      position: relative;
      overflow: hidden;
    }

    .hero h2 {
      margin: 0;
      font-size: 25px;
    }

    .hero p {
      color: var(--muted);
      margin: 7px 0 0;
    }

    .hero-line {
      position: absolute;
      height: 1px;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent, var(--green), transparent);
      animation: heroScan 4s linear infinite;
    }

    @keyframes heroScan {
      from { transform: translateX(-100%); }
      to { transform: translateX(100%); }
    }

    /* ================= EMPTY ================= */

    .empty {
      text-align: center;
      padding: 45px 20px;
      color: var(--muted);
    }

    .empty-icon {
      font-size: 30px;
      margin-bottom: 10px;
      opacity: .65;
    }

    /* ================= TOAST ================= */

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 300;
      min-width: 250px;
      max-width: 400px;
      padding: 13px 15px;
      border: 1px solid var(--line2);
      border-radius: 12px;
      background: rgba(7,16,9,.96);
      color: var(--text);
      box-shadow: 0 0 35px rgba(57,255,120,.1);
      transform: translateY(30px);
      opacity: 0;
      pointer-events: none;
      transition: .35s;
    }

    .toast.show {
      opacity: 1;
      transform: none;
    }

    /* ================= RESPONSIVE ================= */

    @media(max-width: 950px) {
      .sidebar {
        width: 215px;
      }

      .main {
        margin-left: 215px;
      }

      .grid-4 {
        grid-template-columns: repeat(2,1fr);
      }
    }

    @media(max-width: 700px) {
      .sidebar {
        position: relative;
        width: 100%;
        height: auto;
        max-height: none;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .main {
        margin-left: 0;
      }

      .nav-group {

<script>
/* =========================================================
   CORE
========================================================= */

const $ = id => document.getElementById(id);

let currentPage = "dashboard";
let currentEditId = null;
let inboundClients = [];

async function api(url, options = {}) {
  const res = await fetch("/api" + url, {
    credentials: "same-origin",
    headers: {
      "Content-Type": "application/json",
      ...(options.headers || {})
    },
    ...options
  });

  if (res.status === 401) {
    showLogin();
    throw new Error("Unauthorized");
  }

  const data = await res.json().catch(() => ({}));

  if (!res.ok) {
    throw new Error(data.error || "Request failed");
  }

  return data;
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function toast(message, error = false) {
  const el = $("toast");

  el.textContent = message;
  el.style.borderColor = error
    ? "rgba(255,77,103,.4)"
    : "rgba(57,255,120,.28)";

  el.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer = setTimeout(() => {
    el.classList.remove("show");
  }, 2800);
}

function showLogin() {
  $("loginScreen").style.display = "grid";
  $("app").style.display = "none";
}

function showApp() {
  $("loginScreen").style.display = "none";
  $("app").style.display = "block";
}

function logout() {
  localStorage.removeItem("xray_session");
  location.reload();
}

/* =========================================================
   LOGIN
========================================================= */

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();

  try {
    await api("/login", {
      method: "POST",
      body: JSON.stringify({
        username: $("loginUser").value,
        password: $("loginPass").value
      })
    });

    localStorage.setItem("xray_session", "1");

    showApp();
    loadPage("dashboard");

  } catch (err) {
    toast(err.message, true);
  }
});

/* =========================================================
   NAVIGATION
========================================================= */

document.querySelectorAll(".nav-btn[data-page]").forEach(btn => {
  btn.addEventListener("click", () => {
    loadPage(btn.dataset.page);
  });
});

async function loadPage(page) {
  currentPage = page;

  document.querySelectorAll(".nav-btn").forEach(btn => {
    btn.classList.toggle(
      "active",
      btn.dataset.page === page
    );
  });

  const names = {
    dashboard: "Dashboard",
    inbounds: "Inbounds",
    clients: "Clients",
    groups: "Groups",
    nodes: "Nodes",
    hosts: "Hosts",
    outbound: "Outbound",
    routing: "Routing",
    xray: "Xray Core",
    settings: "Settings",
    docs: "API Docs"
  };

  $("pageTitle").textContent = names[page] || page;

  try {
    if (page === "dashboard") return dashboard();
    if (page === "inbounds") return inbounds();
    if (page === "clients") return clients();
    if (page === "groups") return groups();
    if (page === "nodes") return nodes();
    if (page === "hosts") return hosts();
    if (page === "outbound") return outbound();
    if (page === "routing") return routing();
    if (page === "xray") return xray();
    if (page === "settings") return settings();
    if (page === "docs") return apiDocs();
  } catch (err) {
    toast(err.message, true);
  }
}

/* =========================================================
   FORM HELPERS
========================================================= */

function section(title, subtitle, body, open = false, icon = "◆") {
  return `
    <div class="form-section ${open ? "open" : ""}">

      <button type="button"
              class="section-head"
              onclick="toggleSection(this)">

        <div class="section-icon">${icon}</div>

        <div class="section-copy">
          <div class="section-title">${title}</div>
          <div class="section-subtitle">${subtitle}</div>
        </div>

        <div class="chevron">⌄</div>
      </button>

      <div class="section-body">
        <div class="section-inner">
          ${body}
        </div>
      </div>

    </div>
  `;
}

function toggleSection(button) {
  button.closest(".form-section").classList.toggle("open");
}

function field(label, input) {
  return `
    <div class="field">
      <label>${label}</label>
      ${input}
    </div>
  `;
}

function input(name, value = "", placeholder = "") {
  return `
    <input
      name="${name}"
      value="${escapeHtml(value)}"
      placeholder="${escapeHtml(placeholder)}"
    >
  `;
}

function select(name, options, value = "") {
  return `
    <select name="${name}">
      ${options.map(o => `
        <option value="${escapeHtml(o[0])}"
          ${o[0] === value ? "selected" : ""}>
          ${escapeHtml(o[1])}
        </option>
      `).join("")}
    </select>
  `;
}

function switchInput(name, checked = false) {
  return `
    <label class="switch">
      <input
        type="checkbox"
        name="${name}"
        ${checked ? "checked" : ""}
      >
      <span class="slider"></span>
    </label>
  `;
}

function getFormData(form) {
  const fd = new FormData(form);
  const obj = {};

  for (const [key, value] of fd.entries()) {
    obj[key] = value;
  }

  form.querySelectorAll('input[type="checkbox"]').forEach(i => {
    obj[i.name] = i.checked;
  });

  return obj;
}

/* =========================================================
   MODAL
========================================================= */

function modal(title, body, saveFn) {
  $("modalTitle").textContent = title;
  $("modalBody").innerHTML = body;

  $("modalSave").onclick = async () => {
    try {
      await saveFn();
    } catch (err) {
      toast(err.message, true);
    }
  };

  $("modal").classList.add("show");

  setTimeout(() => {
    $("modalBody")
      .querySelector("input,select,textarea")
      ?.focus();
  }, 150);
}

function closeModal() {
  $("modal").classList.remove("show");
}

function addInboundClient() {
  inboundClients.push({
    email: "",
    uuid: generateUUID(),
    flow: "",
    totalGB: 0,
    expiryAt: "",
    reset: "monthly",
    limitIp: 0,
    group: "",
    subscriptionId: "",
    comment: ""
  });

  renderInboundClients();
}

function removeInboundClient(index) {
  inboundClients.splice(index, 1);

  if (!inboundClients.length) {
    addInboundClient();
    return;
  }

  renderInboundClients();
}

function updateClient(index, key, value) {
  inboundClients[index][key] = value;
}

function generateUUID() {
  return crypto.randomUUID
    ? crypto.randomUUID()
    : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0;
        const v = c === "x" ? r : (r & 3 | 8);
        return v.toString(16);
      });
}

function generateClientUUID(index) {
  inboundClients[index].uuid = generateUUID();
  renderInboundClients();
  toast("UUID generated");
}

   INBOUND CONDITIONAL LOGIC
========================================================= */

function bindInboundDynamicFields() {

  const form = $("inboundForm");

  if (!form) return;

  const network = form.elements.network;
  const security = form.elements.security;

  function updateNetwork() {

    $("networkWs")
      ?.classList.toggle("show", network.value === "ws");

    $("networkGrpc")
      ?.classList.toggle("show", network.value === "grpc");

    $("networkXhttp")
      ?.classList.toggle("show", network.value === "xhttp");
  }

  function updateSecurity() {

    $("securityTls")
      ?.classList.toggle("show", security.value === "tls");

    $("securityReality")
      ?.classList.toggle("show", security.value === "reality");
  }

  network?.addEventListener("change", updateNetwork);
  security?.addEventListener("change", updateSecurity);

  updateNetwork();
  updateSecurity();

  renderInboundClients();
}

async function saveInbound() {

  const form = $("inboundForm");
  const data = getFormData(form);

  const overrides = String(data.dest_override || "")
    .split(",")
    .map(x => x.trim())
    .filter(Boolean);

  const payload = {
    ...data,

    port: Number(data.port || 0),

    settings: {
      sniffing: {
        enabled: !!data.sniffing,
        destOverride: overrides
      },

      tls: {
        serverName: data.tls_server_name || "",
        certificateFile: data.cert_path || "",
        keyFile: data.key_path || "",
        alpn: data.alpn || "",
        fingerprint: data.tls_fingerprint || ""
      },

      reality: {
        dest: data.reality_dest || "",
        serverNames: data.reality_server_names || "",
        privateKey: data.reality_private_key || "",
        shortIds: data.reality_short_ids || "",
        fingerprint: data.reality_fingerprint || "",
        spiderX: data.reality_spider_x || ""
      }
    },

    stream_settings: {
      network: data.network,
      security: data.security,

      wsSettings: {
        path: data.ws_path || "",
        host: data.ws_host || ""
      },

      grpcSettings: {
        serviceName: data.grpc_service_name || ""
      },

      xhttpSettings: {
        path: data.xhttp_path || "",
        host: data.xhttp_host || ""
      }
    }
  };

  let result;

  if (currentEditId) {

    result = await api(`/inbounds/${currentEditId}`, {
      method: "PUT",
      body: JSON.stringify(payload)
    });

  } else {

    result = await api("/inbounds", {
      method: "POST",
      body: JSON.stringify(payload)
    });

  }

  /*
   * Save client data separately when an inbound ID
   * is available.
   */
  const inboundId =
    result?.id ||
    currentEditId;

  if (inboundId && inboundClients.length) {

    for (const client of inboundClients) {

      if (!client.uuid && !client.email) continue;

      try {

        await api("/clients", {
          method: "POST",
          body: JSON.stringify({
            ...client,
            inbound_id: inboundId,
            total_gb: Number(client.totalGB || 0),
            limit_ip: Number(client.limitIp || 0)
          })
        });

      } catch (err) {
        console.warn("Client save failed:", err);
      }
    }
  }

  closeModal();

  toast(currentEditId
    ? "Inbound updated successfully"
    : "Inbound created successfully"
  );

  inbounds();
}

  await api(`/inbounds/${id}/toggle`, {

}

async function downloadConfig() {

  try {

    const data = await api("/config");

    const blob = new Blob(
      [JSON.stringify(data, null, 2)],
      { type: "application/json" }
    );

    const a = document.createElement("a");

    a.href = URL.createObjectURL(blob);
    a.download = "xray-config.json";

    a.click();

    URL.revokeObjectURL(a.href);

  } catch (err) {
    toast(err.message, true);
  }
}

async function deleteItem(url, name) {

  if (!confirm(`Delete this ${name}?`)) {
    return;

  await api(url, {

  });

  toast(`${name} deleted`);

  loadPage(currentPage);
}
