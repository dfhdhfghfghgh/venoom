<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xray Panel</title>

<style>
:root{
  --bg:#050505;
  --panel:#0b0b0b;
  --panel2:#101010;
  --line:#1d1d1d;
  --text:#f3f3f3;
  --muted:#858585;
  --green:#00ff88;
  --red:#ff4757;
  --yellow:#ffc857;
  --blue:#4da3ff;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:
    radial-gradient(circle at 20% 0%,rgba(0,255,136,.08),transparent 30%),
    radial-gradient(circle at 90% 90%,rgba(0,160,255,.05),transparent 30%),
    var(--bg);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
  min-height:100vh;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{display:none!important}

.login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-card{
  width:390px;
  background:rgba(10,10,10,.94);
  border:1px solid #252525;
  border-radius:20px;
  padding:35px;
  box-shadow:0 0 80px rgba(0,255,136,.08);
  animation:up .6s ease;
}

@keyframes up{
  from{opacity:0;transform:translateY(25px)}
  to{opacity:1;transform:none}
}

.logo{
  color:var(--green);
  font-size:28px;
  font-weight:800;
  text-align:center;
  letter-spacing:2px;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:var(--muted);
  margin-bottom:30px;
}

.field{
  margin-bottom:16px;
}

label{
  display:block;
  font-size:12px;
  color:#aaa;
  margin-bottom:7px;
}

input,select,textarea{
  width:100%;
  background:#080808;
  color:white;
  border:1px solid #292929;
  border-radius:9px;
  padding:11px 12px;
  outline:none;
}

textarea{
  min-height:90px;
  resize:vertical;
}

input:focus,select:focus,textarea:focus{
  border-color:var(--green);
  box-shadow:0 0 0 2px rgba(0,255,136,.08);
}

.primary{
  width:100%;
  border:0;
  background:var(--green);
  color:#00170c;
  padding:12px;
  border-radius:9px;
  font-weight:800;
}

.primary:hover{
  box-shadow:0 0 20px rgba(0,255,136,.2);
}

.error{
  color:var(--red);
  font-size:13px;
  margin-top:12px;
  text-align:center;
}

.app{
  min-height:100vh;
  display:flex;
}

.sidebar{
  width:235px;
  border-right:1px solid var(--line);
  background:rgba(6,6,6,.95);
  padding:20px 12px;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  z-index:10;
}

.brand{
  font-size:21px;
  font-weight:900;
  color:var(--green);
  padding:10px 12px 25px;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.nav button{
  text-align:left;
  border:0;
  background:transparent;
  color:#929292;
  padding:11px 13px;
  border-radius:8px;
}

.nav button:hover,
.nav button.active{
  background:#121212;
  color:white;
}

.nav button.active{
  box-shadow:inset 2px 0 var(--green);
}

.main{
  margin-left:235px;
  width:calc(100% - 235px);
  padding:25px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.title{
  font-size:25px;
  font-weight:800;
}

.logout{
  background:#151515;
  border:1px solid #292929;
  color:#aaa;
  padding:8px 13px;
  border-radius:8px;
}

.content{
  animation:fade .25s ease;
}

@keyframes fade{
  from{opacity:0;transform:translateY(5px)}
  to{opacity:1;transform:none}
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:20px;
}

.card{
  background:linear-gradient(145deg,#0e0e0e,#090909);
  border:1px solid var(--line);
  border-radius:13px;
  padding:20px;
}

.card-label{
  color:#777;
  font-size:12px;
}

.card-value{
  font-size:30px;
  margin-top:9px;
  font-weight:800;
}

.card-value.green{color:var(--green)}

.panel{
  background:#0b0b0b;
  border:1px solid var(--line);
  border-radius:13px;
  overflow:hidden;
}

.panel-head{
  padding:17px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.panel-title{
  font-weight:800;
}

.toolbar{
  display:flex;
  gap:10px;
  align-items:center;
  margin-bottom:15px;
}

.search{
  max-width:300px;
}

.add{
  background:var(--green);
  border:0;
  color:#00170c;
  padding:10px 15px;
  border-radius:8px;
  font-weight:800;
}

.table-wrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  color:#777;
  font-size:11px;
  text-align:left;
  text-transform:uppercase;
}

th,td{
  padding:14px 16px;
  border-bottom:1px solid #181818;
  white-space:nowrap;
}

td{
  font-size:13px;
}

.empty{
  text-align:center;
  padding:45px;
  color:#666;
}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:20px;
  font-size:11px;
}

.badge.green{
  color:var(--green);
  background:rgba(0,255,136,.08);
}

.badge.red{
  color:var(--red);
  background:rgba(255,71,87,.08);
}

.actions{
  display:flex;
  gap:6px;
}

.action{
  border:1px solid #292929;
  background:#111;
  color:#aaa;
  border-radius:6px;
  padding:6px 9px;
}

.action:hover{
  color:white;
  border-color:#444;
}

.action.delete:hover{
  color:var(--red);
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.78);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:720px;
  max-width:100%;
  max-height:92vh;
  overflow:auto;
  background:#0b0b0b;
  border:1px solid #292929;
  border-radius:15px;
  box-shadow:0 30px 100px #000;
}

.modal-head{
  padding:17px 20px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.close{
  background:none;
  color:#888;
  border:0;
  font-size:22px;
}

.modal-body{
  padding:20px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.form-grid.three{
  grid-template-columns:repeat(3,1fr);
}

.full{
  grid-column:1/-1;
}

.section{
  margin-top:22px;
  margin-bottom:12px;
  color:var(--green);
  font-weight:800;
  font-size:13px;
  text-transform:uppercase;
}

.checkbox{
  display:flex;
  align-items:center;
  gap:8px;
  color:#aaa;
}

.checkbox input{
  width:auto;
}

.modal-foot{
  padding:15px 20px;
  border-top:1px solid var(--line);
  display:flex;
  justify-content:flex-end;
  gap:10px;
}

.secondary{
  background:#151515;
  color:#bbb;
  border:1px solid #292929;
  padding:10px 15px;
  border-radius:8px;
}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#101010;
  border:1px solid #292929;
  padding:12px 16px;
  border-radius:9px;
  display:none;
  z-index:200;
}

.toast.show{
  display:block;
}

@media(max-width:900px){
  .sidebar{
    width:70px;
  }

  .brand{
    font-size:0;
  }

  .brand:first-letter{
    font-size:20px;
  }

  .nav button{
    font-size:0;
    text-align:center;
  }

  .nav button::first-letter{
    font-size:18px;
  }

  .main{
    margin-left:70px;
    width:calc(100% - 70px);
  }

  .cards{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:600px){
  .main{
    padding:15px;
  }

  .cards{
    grid-template-columns:1fr 1fr;
  }

  .form-grid,
  .form-grid.three{
    grid-template-columns:1fr;
  }

  .toolbar{
    flex-direction:column;
    align-items:stretch;
  }

  .search{
    max-width:none;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen" class="login">
  <div class="login-card">
    <div class="logo">XRAY PANEL</div>
    <div class="subtitle">Secure Management Console</div>

    <form id="loginForm">
      <div class="field">
        <label>Username</label>
        <input id="username" value="admin" autocomplete="username">
      </div>

      <div class="field">
        <label>Password</label>
        <input id="password" type="password" autocomplete="current-password">
      </div>

      <button class="primary">Sign In</button>

      <div id="loginError" class="error"></div>
    </form>
  </div>
</div>

<!-- APP -->

<div id="app" class="app hidden">

  <aside class="sidebar">
    <div class="brand">XRAY PANEL</div>

    <nav class="nav">
      <button data-page="dashboard">◉ Dashboard</button>
      <button data-page="inbounds">◈ Inbounds</button>
      <button data-page="clients">◎ Clients</button>
      <button data-page="groups">▣ Groups</button>
      <button data-page="nodes">◆ Nodes</button>
      <button data-page="hosts">◇ Hosts</button>
      <button data-page="xray">⚡ Xray</button>
      <button data-page="outbound">↗ Outbound</button>
      <button data-page="routing">⇄ Routing</button>
      <button data-page="settings">⚙ Settings</button>
      <button data-page="api">⌘ API Docs</button>
    </nav>
  </aside>

  <main class="main">
    <div class="topbar">
      <div id="pageTitle" class="title">Dashboard</div>
      <button class="logout" onclick="logout()">Logout</button>
    </div>

    <div id="content" class="content"></div>
  </main>

</div>

<!-- MODAL -->

<div id="modal" class="modal">
  <div class="modal-box">
    <div class="modal-head">
      <strong id="modalTitle">Create</strong>
      <button class="close" onclick="closeModal()">×</button>
    </div>

    <div id="modalBody" class="modal-body"></div>

    <div class="modal-foot">
      <button class="secondary" onclick="closeModal()">Cancel</button>
      <button id="modalSave" class="add">Save</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const $ = id => document.getElementById(id);

let token = localStorage.getItem("xray_token");
let currentPage = "dashboard";
let editingId = null;

const api = async (url, options={}) => {
  options.headers = {
    ...(options.body ? {"Content-Type":"application/json"} : {}),
    ...(options.headers || {}),
    Authorization: `Bearer ${token}`
  };

  const r = await fetch(url, options);
  const data = await r.json().catch(()=>({}));

  if(!r.ok) throw new Error(data.error || "Request failed");

  return data;
};

function toast(text){
  $("toast").textContent = text;
  $("toast").classList.add("show");

  setTimeout(()=>$("toast").classList.remove("show"),2500);
}

function escapeHtml(v){
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

function modal(title, html, save){
  $("modalTitle").textContent = title;
  $("modalBody").innerHTML = html;
  $("modalSave").onclick = save;
  $("modal").classList.add("show");
}

function closeModal(){
  $("modal").classList.remove("show");
  editingId = null;
}

function nav(page){
  currentPage = page;

  document.querySelectorAll(".nav button")
    .forEach(b=>b.classList.toggle("active",b.dataset.page===page));

  const titles={
    dashboard:"Dashboard",
    inbounds:"Inbounds",
    clients:"Clients",
    groups:"Groups",
    nodes:"Nodes",
    hosts:"Hosts",
    xray:"Xray",
    outbound:"Outbound",
    routing:"Routing",
    settings:"Settings",
    api:"API Docs"
  };

  $("pageTitle").textContent=titles[page] || page;

  loadPage();
}

document.querySelectorAll(".nav button").forEach(btn=>{
  btn.onclick=()=>nav(btn.dataset.page);
});

/* LOGIN */

$("loginForm").onsubmit=async e=>{
  e.preventDefault();

  $("loginError").textContent="";

  try{
    const data=await fetch("/api/login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        username:$("username").value,
        password:$("password").value
      })
    }).then(r=>r.json());

    if(!data.token){
      throw new Error(data.error || "Login failed");
    }

    token=data.token;
    localStorage.setItem("xray_token",token);

    $("loginScreen").classList.add("hidden");
    $("app").classList.remove("hidden");

    nav("dashboard");

  }catch(e){
    $("loginError").textContent=e.message;
  }
};

function logout(){
  localStorage.removeItem("xray_token");
  location.reload();
}

/* DASHBOARD */

async function dashboard(){
  const s=await api("/api/stats");

  $("content").innerHTML=`
    <div class="cards">
      <div class="card">
        <div class="card-label">INBOUNDS</div>
        <div class="card-value green">${s.inbounds}</div>
      </div>

      <div class="card">
        <div class="card-label">CLIENTS</div>
        <div class="card-value">${s.clients}</div>
      </div>

      <div class="card">
        <div class="card-label">GROUPS</div>
        <div class="card-value">${s.groups}</div>
      </div>

      <div class="card">
        <div class="card-label">NODES</div>
        <div class="card-value">${s.nodes}</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <span class="panel-title">System Status</span>
      </div>

      <div style="padding:20px">
        <span class="badge green">PANEL ONLINE</span>
        <span style="margin-left:10px;color:#777">
          Xray Core: ${s.xray ? "Running" : "Not Running"}
        </span>
      </div>
    </div>
  `;
}

/* INBOUNDS */

async function inbounds(){
  const rows=await api("/api/inbounds");

  $("content").innerHTML=`
    <div class="toolbar">
      <input class="search" id="search" placeholder="Search inbounds...">
      <button class="add" onclick="createInbound()">+ Add Inbound</button>
    </div>

    <div class="panel">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Protocol</th>
              <th>Port</th>
              <th>Network</th>
              <th>Security</th>
              <th>Clients</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="rows">
          ${rows.length ? rows.map(r=>`
            <tr>
              <td>${escapeHtml(r.name)}</td>
              <td>${escapeHtml(r.protocol)}</td>
              <td>${r.port}</td>
              <td>${escapeHtml(r.network)}</td>
              <td>${escapeHtml(r.security)}</td>
              <td>${r.client_count}</td>
              <td>
                <span class="badge ${r.enabled?'green':'red'}">
                  ${r.enabled?'Enabled':'Disabled'}
                </span>
              </td>
              <td>
                <div class="actions">
                  <button class="action" onclick='editInbound(${JSON.stringify(r)})'>Edit</button>
                  <button class="action" onclick="toggleInbound('${r.id}')">Toggle</button>
                  <button class="action delete" onclick="deleteItem('/api/inbounds/${r.id}')">Delete</button>
                </div>
              </td>
            </tr>
          `).join("") : `
            <tr><td colspan="8" class="empty">No inbounds yet</td></tr>
          `}
          </tbody>
        </table>
      </div>
    </div>
  `;

  $("search").oninput=e=>{
    const q=e.target.value.toLowerCase();

    document.querySelectorAll("#rows tr").forEach(tr=>{
      tr.style.display=tr.textContent.toLowerCase().includes(q)?"":"none";
    });
  };
}

function inboundForm(r={}){
  const s=r.settings || {};
  const reality=s.reality || {};
  const tls=s.tls || {};
  const stream=r.stream_settings || {};

  return `
    <div class="section">Basic</div>

    <div class="form-grid">
      <div class="field">
        <label>Name / Remark</label>
        <input id="f_name" value="${escapeHtml(r.name||"")}">
      </div>

      <div class="field">
        <label>Protocol</label>
        <select id="f_protocol">
          ${["vless","vmess","trojan","shadowsocks","socks","http","wireguard","hysteria2","dokodemo-door","tun"]
          .map(x=>`<option ${r.protocol===x?"selected":""}>${x}</option>`).join("")}
        </select>
      </div>

      <div class="field">
        <label>Listen IP</label>
        <input id="f_listen" value="${escapeHtml(r.listen||"")}">
      </div>

      <div class="field">
        <label>Port</label>
        <input id="f_port" type="number" value="${r.port||443}">
      </div>

      <div class="field">
        <label>Network / Transport</label>
        <select id="f_network">
          ${["tcp","ws","grpc","httpupgrade","xhttp"]
          .map(x=>`<option ${r.network===x?"selected":""}>${x}</option>`).join("")}
        </select>
      </div>

      <div class="field">
        <label>Security</label>
        <select id="f_security">
          ${["none","tls","reality"]
          .map(x=>`<option ${r.security===x?"selected":""}>${x}</option>`).join("")}
        </select>
      </div>

      <div class="field full">
        <label>Remark</label>
        <input id="f_remark" value="${escapeHtml(r.remark||"")}">
      </div>

      <label class="checkbox">
        <input id="f_enabled" type="checkbox" ${r.enabled!==0?"checked":""}>
        Enabled
      </label>

      <label class="checkbox">
        <input id="f_sniffing" type="checkbox" ${s.sniffing?"checked":""}>
        Sniffing
      </label>
    </div>

    <div class="section">TLS</div>

    <div class="form-grid">
      <div class="field">
        <label>Server Name / SNI</label>
        <input id="f_tlsServerName" value="${escapeHtml(tls.serverName||"")}">
      </div>

      <div class="field">
        <label>Certificate Path</label>
        <input id="f_tlsCert" value="${escapeHtml(tls.certPath||"")}">
      </div>

      <div class="field">
        <label>Private Key Path</label>
        <input id="f_tlsKey" value="${escapeHtml(tls.keyPath||"")}">
      </div>
    </div>

    <div class="section">REALITY</div>

    <div class="form-grid">
      <div class="field full">
        <label>Destination</label>
        <input id="f_realityDest" value="${escapeHtml(reality.dest||"")}">
      </div>

      <div class="field">
        <label>Server Names</label>
        <input id="f_realityServerNames" value="${escapeHtml(reality.serverNames||"")}">
      </div>

      <div class="field">
        <label>Private Key</label>
        <input id="f_realityPrivateKey" value="${escapeHtml(reality.privateKey||"")}">
      </div>

      <div class="field">
        <label>Short IDs</label>
        <input id="f_realityShortIds" value="${escapeHtml(reality.shortIds||"")}">
      </div>

      <div class="field">
        <label>Fingerprint</label>
        <input id="f_realityFingerprint" value="${escapeHtml(reality.fingerprint||"chrome")}">
      </div>
    </div>

    <div class="section">WebSocket</div>

    <div class="form-grid">
      <div class="field">
        <label>Path</label>
        <input id="f_wsPath" value="${escapeHtml(stream.ws?.path||"/")}">
      </div>

      <div class="field">
        <label>Host</label>
        <input id="f_wsHost" value="${escapeHtml(stream.ws?.host||"")}">
      </div>
    </div>

    <div class="section">gRPC</div>

    <div class="field">
      <label>Service Name</label>
      <input id="f_grpcServiceName" value="${escapeHtml(stream.grpc?.serviceName||"")}">
    </div>

    <div class="section">XHTTP</div>

    <div class="form-grid">
      <div class="field">
        <label>Path</label>
        <input id="f_xhttpPath" value="${escapeHtml(stream.xhttp?.path||"/")}">
      </div>

      <div class="field">
        <label>Host</label>
        <input id="f_xhttpHost" value="${escapeHtml(stream.xhttp?.host||"")}">
      </div>
    </div>

    <div class="section">Client</div>

    <div class="form-grid">
      <div class="field">
        <label>Email</label>
        <input id="f_clientEmail" placeholder="client@example.com">
      </div>

      <div class="field">
        <label>UUID</label>
        <input id="f_clientUuid" placeholder="Auto generate">
      </div>

      <div class="field">
        <label>Flow</label>
        <input id="f_clientFlow" placeholder="xtls-rprx-vision">
      </div>

      <div class="field">
        <label>Total Traffic (GB)</label>
        <input id="f_clientTotalGb" type="number" value="0">
      </div>

      <div class="field">
        <label>Expiry</label>
        <input id="f_clientExpiry" type="date">
      </div>

      <div class="field">
        <label>Reset Days</label>
        <input id="f_clientResetDays" type="number" value="0">
      </div>

      <div class="field">
        <label>Limit IP</label>
        <input id="f_clientLimitIp" type="number" value="0">
      </div>

      <div class="field">
        <label>Subscription ID</label>
        <input id="f_clientSubscriptionId">
      </div>

async function downloadConfig(){

  const blob=new Blob(
    [JSON.stringify(c,null,2)],
    {type:"application/json"}
  );

  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="xray-config.json";
  a.click();
}

/* GENERIC TABLE */

function genericTable(title,button,onclick,headers,rows){
  return `
    <div class="toolbar">
      <button class="add" onclick="${onclick}">${button}</button>
    </div>

    <div class="panel">
      <div class="panel-head">
        <span class="panel-title">${title}</span>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              ${headers.map(x=>`<th>${x}</th>`).join("")}
            </tr>
          </thead>

          <tbody>
            ${rows.length
              ?rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")
              :`<tr><td colspan="${headers.length}" class="empty">No data yet</td></tr>`
            }
          </tbody>
        </table>
      </div>
    </div>
  `;
}

/* PAGE LOADER */

async function loadPage(){
  try{
    if(currentPage==="dashboard") await dashboard();
    else if(currentPage==="inbounds") await inbounds();
    else if(currentPage==="clients") await clients();
    else if(currentPage==="groups") await groups();
    else if(currentPage==="nodes") await nodes();
    else if(currentPage==="hosts") await hosts();
    else if(currentPage==="xray") await xray();
    else if(currentPage==="outbound") await outbound();
    else if(currentPage==="routing") await routing();
    else if(currentPage==="settings") await settings();
    else if(currentPage==="api") await apiDocs();
  }catch(e){
    $("content").innerHTML=`
      <div class="panel">
        <div class="empty" style="color:#ff4757">
          ${escapeHtml(e.message)}
        </div>
      </div>
    `;
  }
}

/* SESSION */

async function checkSession(){
  if(!token) return;

  try{
    await api("/api/me");

    $("loginScreen").classList.add("hidden");
    $("app").classList.remove("hidden");

    nav("dashboard");
  }catch{
    localStorage.removeItem("xray_token");
    token=null;
  }
}

checkSession();
